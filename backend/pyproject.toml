[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mezquite-backend"
version = "0.1.0"
description = "Backend FastAPI del proyecto de ciencia ciudadana del mezquite (API REST, tree_id/obfuscacion, productor/consumidor de la cola §6, etiquetado valida/ruido, indicadores Q6)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-jose[cryptography]>=3.3",
    # Verificación del ID token de Google (AUTH_PROVIDER=firebase/google): valida firma/aud/iss
    # contra las llaves públicas de Google. Sin Firebase: el OAuth se configuró en Google Cloud.
    # `requests` es el transporte HTTP que usa google-auth (google.auth.transport.requests).
    "google-auth>=2.0",
    "requests>=2",
    "argon2-cffi>=23",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "redis>=5",
    "pyproj>=3.6",
    # Frontera §6 — dependencia de ruta local (instalada por separado en el Dockerfile).
    "mezquite-contract",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto[s3]>=5", "testcontainers[postgres]>=4"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
