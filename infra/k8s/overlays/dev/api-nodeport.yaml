# Acceso a la API en dev sin Ingress: NodePort. (También sirve `kubectl port-forward svc/api 8000`.)
# Este es un Service SEPARADO (api-nodeport) para no convertir el Service interno `api` en NodePort;
# así los clientes in-cluster siguen usando `api:8000` y el humano entra por <nodeIP>:30080.
apiVersion: v1
kind: Service
metadata:
  name: api-nodeport
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
