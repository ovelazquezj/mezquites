# Secretos (NO config). Espeja AUTH_SECRET y las credenciales de DB del compose.
# IMPORTANTE: estos valores son PLACEHOLDERS INSEGUROS de desarrollo. En stg/prod NO se versionan
# en git: los overlays stg/prod referencian un Secret externo provisto por el operador humano
# (H6: proveedor cloud / gestor de secretos pendiente). Ver overlays/stg/README en cada overlay.
apiVersion: v1
kind: Secret
metadata:
  name: mezquite-secret
type: Opaque
stringData:
  # Secreto para firmar tokens (sin PII en el payload, gate #2). Rotar en stg/prod.
  AUTH_SECRET: "dev-insecure-secret-change-me"
  # Credenciales de la DB. En dev las consume tanto postgres (init) como, vía DATABASE_URL,
  # api/worker. En stg/prod la DATABASE_URL gestionada lleva las credenciales reales.
  POSTGRES_USER: "mezquite"
  POSTGRES_PASSWORD: "mezquite"
  POSTGRES_DB: "mezquite"
