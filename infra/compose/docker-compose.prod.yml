# Stack de PRODUCCIÓN en UN SOLO SERVIDOR (cualquier cloud o servidor propio) — CR-014.
#
# Paridad de entornos (gate #6): mismo código que dev; solo cambia la configuración. Aquí TODO vive
# en un host con Docker: API (FastAPI) + PostgreSQL/PostGIS + Caddy (reverse proxy con TLS automático)
# que sirve los dos bundles Flutter Web. Sin nube gestionada, sin Kubernetes.
#
#   1) cp infra/compose/.env.prod.example infra/compose/.env.prod   # y EDITA los valores
#   2) compila los dos bundles web (ver docs/DESPLIEGUE-SERVIDOR-UNICO.md §6)
#   3) docker compose -f infra/compose/docker-compose.prod.yml --env-file infra/compose/.env.prod up -d --build
#
# La frontera YOLO (§6) está INACTIVA (CR-001): no hay Redis ni result-worker/mock-validator.
# Runbook completo (hardware/software/Firebase/despliegue): docs/DESPLIEGUE-SERVIDOR-UNICO.md

services:
  postgres:
    image: postgis/postgis:16-3.4
    env_file: [.env.prod]
    # POSTGRES_USER/PASSWORD/DB se leen de .env.prod. La imagen postgis ya trae la extensión;
    # la migración 0001 ejecuta `CREATE EXTENSION postgis` sobre la base creada aquí.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin `ports`: la DB NO se expone fuera del host (solo la red interna la alcanza). Para un
    # psql manual: `docker compose ... exec postgres psql -U $POSTGRES_USER -d $POSTGRES_DB`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file: [.env.prod]
    # Imágenes en el filesystem del host (STORAGE_BACKEND=local). La DB guarda solo la clave.
    volumes:
      - obsdata:/data/storage
    # Expuesto SOLO a localhost para smoke test/diagnóstico; el tráfico público entra por Caddy.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # El CMD del Dockerfile aplica migraciones Alembic (`alembic upgrade head`) y luego uvicorn.
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    # TLS automático (Let's Encrypt). Requiere DNS de los subdominios apuntando a este host y
    # puertos 80/443 abiertos. Los dominios y el correo ACME se leen de .env.prod.
    env_file: [.env.prod]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Bundles Flutter Web ya compilados (ver runbook §6). Solo lectura.
      - ../../mobile/build/web:/srv/voluntario:ro
      - ../../web-admin/build/web:/srv/admin:ro
      # Persistencia de certificados y estado de Caddy (no re-emitir TLS en cada reinicio).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

# --- Reactivar la cola §6 (YOLO) a futuro, si hiciera falta ---
# Hoy NO se usa (BROKER=memory). Si se reactiva la validación automática: añadir un servicio `redis`,
# poner BROKER=redis + REDIS_URL en .env.prod y levantar result-worker/mock-validator (ver
# docker-compose.dev.yml, perfil `yolo`). El código del cliente y la API no cambian (gate #6).

volumes:
  pgdata:
  obsdata:
  caddy_data:
  caddy_config:
