# Stack de desarrollo SIN NUBE (paridad de entornos, gate #6).
# Núcleo (arranque por defecto): DB (PostGIS) + Redis + API (FastAPI).
# Este archivo CRECE, no se reemplaza.
#
#   docker compose -f infra/compose/docker-compose.dev.yml up --build
#
# REVISIÓN HUMANA (CR-001, 2026-06-15): la validación automática (YOLO) quedó INACTIVA. El submit
# ya no encola jobs; la calidad la decide una persona desde la web admin. Por eso `mock-validator` y
# `result-worker` quedan tras el perfil `yolo` y NO arrancan por defecto (siguen en el repo para
# reactivar la frontera §6 a futuro sin tocar cliente ni backend):
#
#   docker compose -f infra/compose/docker-compose.dev.yml --profile yolo up --build
#
# Topología de la frontera §6 (solo con el perfil `yolo`, hoy ociosa):
#   api ──XADD──▶ [mezquite:validation_jobs] ──▶ mock-validator
#   mock-validator ──XADD──▶ [mezquite:validation_results] ──▶ result-worker
#
# Sin nube (gate #6): storage = filesystem local (volumen), broker = Redis local, DB = contenedor.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mezquite
      POSTGRES_PASSWORD: mezquite
      POSTGRES_DB: mezquite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mezquite -d mezquite"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mezquite:mezquite@postgres:5432/mezquite
      STORAGE_BACKEND: local            # gate #6: dev/QA sin nube
      STORAGE_LOCAL_DIR: /data/storage
      BROKER: redis                     # broker local (conmutable; 'memory' también válido)
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: dev-insecure-secret-change-me
      # Auth identidad real (CR-002): mock en dev (sin red ni Google; gate #6). Para Google real,
      # AUTH_PROVIDER=firebase + FIREBASE_PROJECT_ID. SMTP_* opcionales (reset por correo del admin).
      AUTH_PROVIDER: mock
    ports:
      - "8000:8000"
    volumes:
      - obsdata:/data/storage           # imágenes en filesystem local (la DB guarda solo la clave)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Aplica migraciones Alembic y arranca uvicorn (ver backend/Dockerfile CMD).
    restart: unless-stopped

  # INACTIVO por CR-001: solo arranca con `--profile yolo` (frontera §6 reactivable).
  result-worker:
    profiles: ["yolo"]
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.result_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://mezquite:mezquite@postgres:5432/mezquite
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /data/storage
      BROKER: redis
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: dev-insecure-secret-change-me
    volumes:
      - obsdata:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started      # asegura que las migraciones ya corrieron
    restart: unless-stopped

  # INACTIVO por CR-001: solo arranca con `--profile yolo` (frontera §6 reactivable).
  mock-validator:
    profiles: ["yolo"]
    build:
      context: ../..
      dockerfile: mock-validator/Dockerfile
    environment:
      MOCK_BROKER: redis
      REDIS_URL: redis://redis:6379/0
      MOCK_MODE: regla
      MOCK_LATENCY_MS_MIN: "50"
      MOCK_LATENCY_MS_MAX: "300"
      MOCK_MODEL_VERSION: mock
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  obsdata:
