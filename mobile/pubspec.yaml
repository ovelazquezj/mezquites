name: mezquite_app
description: App del voluntario para el proyecto de ciencia ciudadana del mezquite.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Estado: Riverpod para inyección de dependencias y estado de la app.
  flutter_riverpod: ^2.6.1
  # Cliente HTTP para la capa de API REST (/api/v1).
  http: ^1.2.2
  # Cámara NATIVA (gate #4): captura directa; la galería NO se usa.
  camera: ^0.11.0+2
  # Geolocalización real para inyectar lat/lon en el EXIF/payload (gate #4).
  geolocator: ^13.0.2
  # Escritura de EXIF lat/lon/timestamp en el JPEG capturado (gate #4).
  native_exif: ^0.6.2
  # Persistencia local sin PII: token, handle (de presentación), flag de disclaimer visto.
  shared_preferences: ^2.3.3
  # Wordmark "Mezquite" en serif de Google Fonts (CR-003): se usa Fraunces.
  google_fonts: ^6.2.1
  # --- Autenticación con identidad real (CR-002, sin Firebase) ---
  # Sign in with Google con Google Identity Services (GIS) DIRECTO, sin Firebase: el OAuth se
  # configuró en Google Cloud (APIs y servicios). La app guarda SOLO el id opaco (provider+sub):
  # nunca email/nombre (gate #2 acotado). En WEB el login usa el botón que renderiza el SDK
  # (`renderButton`, de google_sign_in_web) y se obtiene el ID token de Google; el backend lo
  # verifica (iss=accounts.google.com, aud=Web Client ID). En modo MOCK (por defecto) no se usa
  # ninguna de estas librerías en red, así que `flutter build`/tests corren sin proyecto real.
  # 7.0–7.1: 7.2+ exige Dart 3.7 (tenemos 3.6 con Flutter 3.27).
  google_sign_in: ">=7.0.0 <7.2.0"
  # Implementación web de google_sign_in: expone `renderButton` (web_only.dart) para el botón GIS.
  google_sign_in_web: ^1.0.0
  # Captura por cámara en WEB (CR-005): image_picker(camera) -> bytes -> MultipartFile.fromBytes.
  # En navegador de teléfono/tablet abre la cámara real (gate #4, W0=a). El móvil NATIVO sigue
  # usando `camera`+`native_exif` (sin galería); image_picker solo se usa en la rama web.
  image_picker: ^1.1.2
  # --- Contenidos de "Aprender" (CR-007) ---
  # Render del markdown bundleado (texto propio + enlaces "Saber más"). Compila en web.
  flutter_markdown: ^0.7.4
  # Abrir los enlaces "Saber más" en el navegador EXTERNO (LaunchMode.externalApplication).
  url_launcher: ^6.3.0
  # --- Mapa de calor público (CR-009) ---
  # Mapa interactivo con tiles de OpenStreetMap + capa de celdas de calor (300 m).
  # Compila en web y en móvil nativo; sin dependencia de Google Maps (sin API key).
  # Versiones compatibles con Flutter 3.27 / Dart 3.6.
  flutter_map: ^7.0.2
  # Tipo LatLng para flutter_map (centro de celda obfuscado, gate #5).
  latlong2: ^0.9.1
  # --- Instalación como PWA (CR-016) ---
  # Interop con el navegador (window/eventos) para el botón "Instalar app" (solo web).
  web: ^1.1.0
  # --- Captura sin conexión (CR-031) ---
  # Directorio privado de la app donde se guardan los JPEG pendientes de subir
  # (móvil nativo). NO es la galería: el gate #4 sigue intacto.
  path_provider: ^2.1.4
  # IndexedDB en el navegador para la cola de la PWA (que es el caso de PRODUCCIÓN).
  # Guarda los bytes en binario; `shared_preferences` (localStorage) topa en ~5 MB y
  # obligaría a base64, que infla otro 33 %.
  idb_shim: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pruebas de integración en emulador/dispositivo Android (T1).
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generación del ícono de launcher Android/iOS desde el master de marca (CR-003).
  flutter_launcher_icons: ^0.14.1
  # Generación del splash nativo (incl. Android 12) desde el logo de marca (CR-003).
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/design-tokens.json
    - assets/branding/
    # Contenidos de "Aprender" (CR-007): markdown bundleado por módulo. Stubs en
    # dev/tests; el orquestador los reemplaza por docs/learning/ en la integración.
    - assets/learning/
    # Ilustraciones de los módulos (CR-032). Va aparte porque declarar
    # `assets/learning/` NO incluye subcarpetas en Flutter. Empaquetadas, no
    # enlazadas: "Aprender" tiene que funcionar sin conexión.
    - assets/learning/img/

# --- Ícono de app (CR-003) ---
# Genera mipmaps Android (mdpi→xxxhdpi) desde el master de marca; adaptive icon
# con fondo navy oficial. Comando: dart run flutter_launcher_icons
# NOTA: este repo solo tiene scaffold Android (no existe mobile/ios/). La config
# de iOS (ios: true, remove_alpha_ios: true) queda preparada para cuando se cree
# el scaffold iOS; hoy ios: false para que el comando complete en CI/Windows.
flutter_launcher_icons:
  image_path: "assets/branding/icon_master_1024.png"
  android: true
  ios: false
  remove_alpha_ios: true
  adaptive_icon_background: "#1F3A6E"
  adaptive_icon_foreground: "assets/branding/icon_master_1024.png"

# --- Splash nativo (CR-003) ---
# Fondo navy oficial + logo centrado; bloque android_12 para la nueva API de
# splash de Android 12+. Comando: dart run flutter_native_splash:create
# NOTA: solo Android (no existe mobile/ios/); el bloque ios queda en false hasta
# que exista el scaffold iOS.
flutter_native_splash:
  color: "#1F3A6E"
  image: "assets/branding/splash_logo_master.png"
  android: true
  ios: false
  # El splash web es el propio (CR-005, en web/index.html). Que la tool NO lo regenere
  # (evita que sobrescriba index.html y cree web/splash/).
  web: false
  android_12:
    color: "#1F3A6E"
    image: "assets/branding/splash_logo_master.png"
  fullscreen: true
