<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App del voluntario para registrar mezquites (ciencia ciudadana).">
  <meta name="theme-color" content="#1F3A6E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mezquite">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mezquite</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Splash de marca (CR-005): fondo navy + logo; se retira al primer frame de Flutter. -->
  <style>
    #splash{position:fixed;inset:0;background:#1F3A6E;display:flex;align-items:center;
      justify-content:center;z-index:9999;transition:opacity .3s ease}
    #splash img{width:55%;max-width:320px}
  </style>
  <div id="splash"><img src="splash.png" alt="Mezquite"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 320); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
